<text x="70" y="170" font-size="19" font-style="italic" font-family="Georgia,serif" fill="#2a3b66">Perth, 3 March 1975</text><text x="70" y="202" font-size="19" font-style="italic" font-family="Georgia,serif" fill="#2a3b66"></text><text x="70" y="234" font-size="19" font-style="italic" font-family="Georgia,serif" fill="#2a3b66">Dear Mum and Dad,</text><text x="70" y="266" font-size="19" font-style="italic" font-family="Georgia,serif" fill="#2a3b66"></text><text x="70" y="298" font-size="19" font-style="italic" font-family="Georgia,serif" fill="#2a3b66">We&#x27;ve arrived safely in Perth and</text><text x="70" y="330" font-size="19" font-style="italic" font-family="Georgia,serif" fill="#2a3b66">Robert starts at the shipyard on</text><text x="70" y="362" font-size="19" font-style="italic" font-family="Georgia,serif" fill="#2a3b66">Monday. The ocean here is lovely.</text><text x="70" y="394" font-size="19" font-style="italic" font-family="Georgia,serif" fill="#2a3b66">I miss you all terribly.</text><text x="70" y="426" font-size="19" font-style="italic" font-family="Georgia,serif" fill="#2a3b66"></text><text x="70" y="458" font-size="19" font-style="italic" font-family="Georgia,serif" fill="#2a3b66">With love,</text><text x="70" y="490" font-size="19" font-style="italic" font-family="Georgia,serif" fill="#2a3b66">Joan</text><text x="70" y="522" font-size="19" font-style="italic" font-family="Georgia,serif" fill="#2a3b66"></text><text x="70" y="554" font-size="19" font-style="italic" font-family="Georgia,serif" fill="#2a3b66">(SAMPLE letter, fictional)</text>
<text x="300" y="470" font-size="96" text-anchor="middle" font-family="Arial,sans-serif" font-weight="bold" fill="#c0392b" fill-opacity="0.22" transform="rotate(-30 300 470)">EXAMPLE</text>
<text x="300" y="745" font-size="15" text-anchor="middle" font-family="Arial,sans-serif" fill="#c0392b">SAMPLE DOCUMENT · FICTIONAL · NOT A REAL RECORD</text></svg>