name = "family-tree-private"
main = "src/index.js"
compatibility_date = "2026-03-01"
workers_dev = false

# Local preview only. Do not deploy this file as-is to a public hostname.
# DEV_IDENTITY is ignored unless the request host is localhost or 127.0.0.1.
[vars]
ENVIRONMENT = "dev"
DEV_IDENTITY = "1"
ACCESS_TEAM_DOMAIN = "example.cloudflareaccess.com"
ACCESS_AUD = "replace-with-access-application-aud"

[[d1_databases]]
binding = "DB"
database_name = "family-tree"
database_id = "00000000-0000-0000-0000-000000000000"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "family-tree-private"

[assets]
directory = "../app"
binding = "ASSETS"
run_worker_first = true
